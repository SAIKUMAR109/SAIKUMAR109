<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My GitHub Portfolio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header -->
    <header>
        <nav>
            <h1 class="logo"><span>{"</span>DevPort<span>"}</span></h1>
            <ul class="nav-links">
                <li><a href="#home">Home</a></li>
                <li><a href="#projects">Projects</a></li>
                <li><a href="#skills">Skills</a></li>
            </ul>
            <button id="theme-toggle"><i class="fas fa-moon"></i></button>
        </nav>
    </header>

    <!-- Hero Section -->
    <section id="home" class="hero">
        <div class="hero-content">
            <h2>Hi, I'm <span class="highlight">Your Name</span></h2>
            <p>Full-Stack Developer & Open Source Contributor</p>
            <div class="socials">
                <a href="https://github.com/yourusername" target="_blank"><i class="fab fa-github"></i></a>
                <a href="#"><i class="fab fa-linkedin"></i></a>
                <a href="#"><i class="fab fa-twitter"></i></a>
            </div>
            <a href="https://github.com/saikumar" target="_blank" class="github-btn">
                View My GitHub
            </a>
        </div>
    </section>

    <!-- Projects Section -->
    <section id="projects" class="projects">
        <h2>Featured Projects</h2>
        <div class="project-grid">
            <div class="project-card">
                <h3>Project 1</h3>
                <p>AI Chat Application</p>
                <a href="#" class="project-link">View on GitHub →</a>
            </div>
            <!-- Add more project cards -->
        </div>
    </section>

    <!-- Skills Section -->
    <section id="skills" class="skills">
        <h2>Technical Skills</h2>
        <div class="skills-container">
            <div class="skill-item">Python</div>
            <div class="skill-item">JavaScript</div>
            <div class="skill-item">React</div>
            <!-- Add more skills -->
        </div>
    </section>

    <script src="script.js"></script>
</body>
</html>
